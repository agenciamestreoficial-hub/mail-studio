<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Uma oferta com a sua marca</title>
  <style>
    body { margin:0; padding:0; background:#f0eef5; }
    @media screen and (max-width:600px) { .email-shell { width:100%!important; } .email-cell { padding:24px!important; } }
  </style>
</head>
<body>
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f0eef5">
    <tr><td align="center" style="padding:32px 12px">
      <!--[if mso]><table role="presentation" width="600"><tr><td><![endif]-->
      <table class="email-shell" role="presentation" width="600" cellspacing="0" cellpadding="0" style="width:100%;max-width:600px;background:#ffffff">
        <tr><td class="email-cell" style="padding:44px;font-family:Arial,sans-serif">
          <p style="font-size:13px;letter-spacing:3px;color:#7060cf">FEITO DO SEU JEITO</p>
          <h1 style="font-size:36px;line-height:1.15;color:#302947">Seu código.<br>Suas possibilidades.</h1>
          <p style="font-size:16px;line-height:1.8;color:#777088">Olá, [FNAME]. Este e-mail foi importado como HTML completo. Edite o código e acompanhe a prévia ao lado.</p>
          <p style="padding:18px 0"><a href="https://example.com" style="display:inline-block;background:#7060cf;color:white;text-decoration:none;padding:16px 24px;border-radius:8px">Conheça as novidades →</a></p>
          <p style="font-size:12px;line-height:1.8;color:#8c899c">[COMPANY_FULL_ADDRESS]<br><a href="[UNSUBSCRIBE_URL]" style="color:#8c899c">Cancelar inscrição</a></p>
        </td></tr>
      </table>
      <!--[if mso]></td></tr></table><![endif]-->
    </td></tr>
  </table>
</body>
</html>
